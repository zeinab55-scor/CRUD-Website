<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud </title>
    <link rel="stylesheet" href="Crud.css">
</head>
<body>
    <div class="crud">
<div class="head">
<h2>CRUD</h2>
<p>PRODUCT MANAGEMENT SYSTEM</p>
</div>
<div class="inputs">
    <input type="text" placeholder="title" id="title">
    <div class="price">
        <input type="number" placeholder="price" id="price" onkeyup="gettotal()">
        <input type="number" placeholder="taxes" id="taxes" onkeyup="gettotal()">
        <input type="number" placeholder="ads" id="ads" onkeyup="gettotal()">
        <input type="number" placeholder="discount" id="discount" onkeyup="gettotal()">
        <small id="total"></small>
    </div>
    <input type="number" placeholder="count" id="count">
    <input type="text" placeholder="category" id="category">
    <button id="Create">Create</button>
</div>
<div class="outputs">
    <div class="searchBlock">
    <input type="text" placeholder="Search" id="Search" onkeyup="searchdata(this.value)">
    <div class="btnsearch">
        <button  id="btntitle"  onclick="getsearchmood(this.id)">Search By Title</button>
        <button  id="btncategory"  onclick="getsearchmood(this.id)">Search By Category</button>

</div>

</div>
<div id="deleteall">

</div>
<table>
<tr>
    <th>id</th>
    <th>title</th>
    <th>price</th>
    <th>taxes</th>
    <th>ads</th>
    <th>discount</th>
    <th>total</th>
    <th>category</th>
    <th>update</th>
<th>delete</th>
</tr>
<tbody id="tbody">
 
 





</tbody>





</table>







</div></div>
    <script src="Crud.js"></script>
</body>
</html>
